<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- Piezas comunes a todas las paginas de Duo -->

<head th:fragment="cabeza(titulo)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title th:text="|Duo · ${titulo}|">Duo</title>
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
<!-- Aplica el modo claro/oscuro guardado antes de pintar, para que no parpadee -->
<script th:src="@{/js/tema.js}"></script>
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
<!-- Para instalar Duo en la pantalla de inicio del movil (y recibir avisos) -->
<link rel="manifest" th:href="@{/manifest.webmanifest}">
<link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
<meta name="apple-mobile-web-app-title" content="Duo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<header class="barra" th:fragment="cabecera(activo)">
  <a class="marca" th:href="@{/}" aria-label="duo, ir al resumen"><span class="marca-logo" aria-hidden="true"><i></i><i></i></span>duo</a>
  <nav class="nav" aria-label="Secciones">
    <a th:href="@{/}" th:classappend="${activo == 'resumen'} ? 'activo'" th:aria-current="${activo == 'resumen'} ? 'page'"><svg class="ico" aria-hidden="true"><use href="#i-casa"/></svg><span>Resumen</span></a>
    <a th:href="@{/calendario}" th:classappend="${activo == 'calendario'} ? 'activo'" th:aria-current="${activo == 'calendario'} ? 'page'"><svg class="ico" aria-hidden="true"><use href="#i-calendario"/></svg><span>Calendario</span></a>
    <a th:href="@{/horarios}" th:classappend="${activo == 'horarios'} ? 'activo'" th:aria-current="${activo == 'horarios'} ? 'page'"><svg class="ico" aria-hidden="true"><use href="#i-reloj"/></svg><span>Horarios</span></a>
    <a th:href="@{/ahorros}" th:classappend="${activo == 'ahorros'} ? 'activo'" th:aria-current="${activo == 'ahorros'} ? 'page'"><svg class="ico" aria-hidden="true"><use href="#i-hucha"/></svg><span>Ahorros</span></a>
    <a th:href="@{/repartir}" th:classappend="${activo == 'repartir'} ? 'activo'" th:aria-current="${activo == 'repartir'} ? 'page'"><svg class="ico" aria-hidden="true"><use href="#i-dividir"/></svg><span>Repartir</span></a>
  </nav>
  <a class="btn primario btn-nuevo" id="btn-nuevo" th:href="@{/calendario(nueva=1)}" title="Nueva actividad"><svg class="ico" aria-hidden="true"><use href="#i-mas"/></svg><span>Nueva actividad</span></a>
  <div class="acciones">
    <button class="btn redondo" id="cambiar-modo" aria-label="Cambiar a modo claro" title="Cambiar a modo claro">
      <svg class="ico solo-oscuro"><use href="#i-sol"/></svg>
      <svg class="ico solo-claro"><use href="#i-luna"/></svg>
    </button>
    <!-- Campanita: lo que se ha añadido y quitado -->
    <div class="novedades">
      <button type="button" class="btn redondo" id="btn-novedades" aria-haspopup="dialog" aria-expanded="false"
              aria-controls="panel-novedades" aria-label="Novedades" title="Novedades"
              th:data-foto-yo="${yo.tieneFoto} ? @{/usuarios/{u}/foto(u=${yo.username},v=${yo.fotoVersion})} : ''"
              th:data-foto-otro="${otro.tieneFoto} ? @{/usuarios/{u}/foto(u=${otro.username},v=${otro.fotoVersion})} : ''">
        <svg class="ico"><use href="#i-campana"/></svg>
        <span class="contador" id="contador-novedades" hidden></span>
      </button>
      <div class="menu panel-novedades" id="panel-novedades" role="dialog" aria-label="Novedades" hidden>
        <div class="menu-cab panel-cab">
          <b>Novedades</b>
          <div class="segmentado filtro-novedades" id="filtro-novedades">
            <button type="button" aria-pressed="true" data-f="todo">Todo</button>
            <button type="button" aria-pressed="false" data-f="otro" th:text="${otro.nombre}">Otro</button>
            <button type="button" aria-pressed="false" data-f="yo">Yo</button>
          </div>
        </div>
        <ol class="lista-novedades" id="lista-novedades"></ol>
      </div>
    </div>

    <!-- Menu del usuario: perfil y cambiar de persona -->
    <div class="menu-usuario">
      <button type="button" class="yo-avatar" id="btn-usuario" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-usuario"
              th:aria-label="|Menú de ${yo.nombre}|" th:title="${yo.nombre}">
        <img th:if="${yo.tieneFoto}" th:src="@{/usuarios/{u}/foto(u=${yo.username},v=${yo.fotoVersion})}" alt="">
        <th:block th:unless="${yo.tieneFoto}" th:text="${yo.inicial}">D</th:block>
        <i class="aviso-punto" id="aviso-punto" hidden></i>
      </button>
      <div class="menu" id="menu-usuario" role="menu" hidden>
        <div class="menu-cab">
          <b th:text="${yo.nombre}">Ana</b>
        </div>
        <button type="button" role="menuitem" id="abrir-perfil"><svg class="ico"><use href="#i-usuario"/></svg>Mi perfil</button>
        <form th:action="@{/logout}" method="post">
          <button type="submit" role="menuitem"><svg class="ico"><use href="#i-salir"/></svg>Cambiar de persona</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Ventana "Mi perfil" -->
  <dialog class="perfil caja" id="dlg-perfil" aria-labelledby="perfil-titulo">
    <div class="perfil-cab">
      <h3 class="titulo" id="perfil-titulo">Mi perfil</h3>
      <button type="button" class="borrar" id="cerrar-perfil" aria-label="Cerrar"><svg class="ico"><use href="#i-cerrar"/></svg></button>
    </div>

    <div class="perfil-foto">
      <div class="foto-grande" id="pf-foto">
        <img th:if="${yo.tieneFoto}" th:src="@{/usuarios/{u}/foto(u=${yo.username},v=${yo.fotoVersion})}" alt="Tu foto de perfil">
        <th:block th:unless="${yo.tieneFoto}" th:text="${yo.inicial}">D</th:block>
      </div>
      <div class="perfil-foto-acciones">
        <label class="btn primario" for="pf-archivo"><svg class="ico"><use href="#i-camara"/></svg>Cambiar foto</label>
        <input type="file" id="pf-archivo" accept="image/png,image/jpeg,image/webp" hidden>
        <button type="button" class="btn" id="pf-quitar" th:hidden="${!yo.tieneFoto}">Quitar foto</button>
        <small>JPG, PNG o WebP. Se recorta en cuadrado.</small>
      </div>
    </div>

    <form class="perfil-bloque" id="pf-datos">
      <label for="pf-nombre">Nombre que se muestra</label>
      <div class="perfil-fila">
        <input id="pf-nombre" maxlength="30" required th:value="${yo.nombre}">
        <button class="btn" type="submit">Guardar</button>
      </div>
    </form>

    <div class="perfil-bloque" id="pf-avisos">
      <label>Avisos en el móvil</label>
      <small>Cada día a las 20:00 te avisa de los planes que tienes al día siguiente.</small>
      <p class="pf-avisos-estado" id="pf-avisos-estado" role="status">Comprobando…</p>
      <div class="perfil-fila-botones">
        <button class="btn primario" type="button" id="pf-avisos-activar" hidden>Activar avisos</button>
        <button class="btn" type="button" id="pf-avisos-prueba" hidden>Enviar prueba</button>
        <button class="btn" type="button" id="pf-avisos-quitar" hidden>Desactivar</button>
      </div>
    </div>

    <p class="form-error" id="pf-error" role="alert" hidden></p>
    <p class="perfil-ok" id="pf-ok" role="status" hidden></p>
  </dialog>

  <!-- Ventana de confirmacion (para no hacer cambios por error) -->
  <dialog class="perfil caja confirmar" id="dlg-confirmar" aria-labelledby="confirmar-titulo" aria-describedby="confirmar-texto">
    <h3 class="titulo" id="confirmar-titulo">¿Seguro?</h3>
    <div class="confirmar-texto" id="confirmar-texto"></div>
    <div class="confirmar-botones">
      <button type="button" class="btn" id="confirmar-no">Volver</button>
      <button type="button" class="btn primario" id="confirmar-si">Sí, guardar</button>
    </div>
  </dialog>
</header>

</html>
