spring.application.name=duo

# Base de datos H2 guardada en un archivo (carpeta ./data) para no perder nada al reiniciar
spring.datasource.url=jdbc:h2:file:./data/duo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fotos de perfil: el navegador las reduce antes de subirlas
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Mostrar en la web los mensajes de error de validacion (ej. "Hora no valida")
server.error.include-message=always

# ---------- Quien puede conectarse ----------
# Solo se aceptan conexiones desde este mismo ordenador: Duo no tiene contraseñas.
server.address=127.0.0.1

# ---------- Seguridad de la sesion ----------
# La cookie de sesion no la puede leer JavaScript y no se envia desde otras webs
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Se cierra la sesion tras 8 horas sin usar la web
server.servlet.session.timeout=8h
# No mostrar detalles internos en las paginas de error
server.error.include-stacktrace=never
server.error.include-exception=false

# ---------- Las dos personas ----------
# Nombres con los que se crean la primera vez (luego se cambian desde Mi perfil)
duo.persona-a.nombre=${DUO_PERSONA_A_NOMBRE:Ana}
duo.persona-b.nombre=${DUO_PERSONA_B_NOMBRE:Leo}

# Enable Banking PSD2 (opcional; sin estos valores la integración se muestra como no disponible).
duo.banco.app-id=${DUO_BANCO_APP_ID:}
duo.banco.clave-privada=${DUO_BANCO_CLAVE_PRIVADA:}
# Tu banco tal como lo nombra Enable Banking (basta con una parte del nombre)
duo.banco.nombre=${DUO_BANCO_NOMBRE:}
# Quien puede conectar su banco. Lista separada por comas.
duo.banco.usuarios=${DUO_BANCO_USUARIOS:persona-a,persona-b}
duo.banco.redirect-url=${DUO_BANCO_REDIRECT_URL:http://localhost:8080/ahorros/banco/vuelta}

# Quien ve la pagina nueva de Ahorros (pensada para el banco conectado). El resto, la clasica.
duo.ahorros.vista-nueva=${DUO_AHORROS_VISTA_NUEVA:persona-a,persona-b}

# Avisos en el movil (Web Push): cuando se manda el recordatorio de los planes de mañana
duo.avisos.cron=${DUO_AVISOS_CRON:0 0 20 * * *}
# Contacto que se pone en la firma de los avisos (lo piden Apple y Google): la web donde publiques Duo
duo.avisos.contacto=${DUO_AVISOS_CONTACTO:https://example.com}
